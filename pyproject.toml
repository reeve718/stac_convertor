[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stac-convertor"
version = "0.1.0"
description = "Convert GeoJSON FeatureCollections to STAC Collections and Items"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pyproj>=3.6.0",
    "ijson>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
geojson2stac = "cli:app"
